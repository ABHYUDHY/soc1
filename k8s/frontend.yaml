apiVersion: apps/v1
kind: Deployment
metadata: { name: soc-frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: soc-frontend } }
  template:
    metadata: { labels: { app: soc-frontend } }
    spec:
      containers:
      - name: frontend
        image: soc-frontend:latest
        ports: [{ containerPort: 5173 }]
---
apiVersion: v1
kind: Service
metadata: { name: soc-frontend }
spec:
  selector: { app: soc-frontend }
  ports: [{ port: 80, targetPort: 5173 }]
